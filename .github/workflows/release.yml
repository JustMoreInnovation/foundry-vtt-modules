name: Build & Release

# Every push to main is a release. GitVersion (GitVersion.yml) computes the version from git history:
#   patch by default, minor for "feat:" / "+semver: minor", major for "type!:" / "BREAKING CHANGE:" / "+semver: major".
# A head commit containing "+semver: none" (or "skip") builds but does not release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GitVersion needs full history and tags

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.8.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Decide whether to release
        id: release
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          release=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            release=true
            if printf '%s' "$HEAD_MSG" | grep -Eq '\+semver:[[:space:]]?(none|skip)'; then
              echo "::notice::Head commit says +semver: none - building without a release"; release=false
            elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::notice::v$VERSION already exists - nothing to release"; release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (release: $release)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build module
        run: node tools/build.mjs --version "${{ steps.gitversion.outputs.semVer }}" --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmi-3d-toolkit-${{ steps.gitversion.outputs.semVer }}
          path: |
            dist/module.json
            dist/module.zip

      - name: Publish GitHub release
        if: steps.release.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: v${{ steps.gitversion.outputs.semVer }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/module.json
            dist/module.zip
          generate_release_notes: true
