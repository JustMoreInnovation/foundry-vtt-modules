name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build module
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          node tools/build.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Check release version matches tag
        if: github.ref_type == 'tag'
        run: |
          test "$(jq -r .version dist/module.json)" = "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: jmi-3d-toolkit
          path: |
            dist/module.json
            dist/module.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/module.zip
          generate_release_notes: true
